# Services for Doppel. Two ways to run:
#   * Dev loop (default):  `docker compose up -d`  → Postgres only; run the app/worker via `uv run`.
#   * Full stack:          `docker compose --profile app up`  → Postgres + Redis + a one-shot
#     `migrate` + the FastAPI app + the ARQ worker (the app image installs the heavy `clap` group).
# OrbStack provides the Docker daemon: `orb start` first.
#
# Already running Postgres/Redis on the standard ports? Override the HOST port and point DATABASE_URL
# at it: `DOPPEL_DB_PORT=5433 docker compose up -d` with DATABASE_URL=...@localhost:5433/doppel.
# (Inter-service traffic uses the Docker network on :5432/:6379 regardless of the host-port override.)
#
# Secrets come from the host environment / a gitignored .env (ANTHROPIC_API_KEY, LASTFM_API_KEY).

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: doppel
      POSTGRES_PASSWORD: doppel
      POSTGRES_DB: doppel
    ports:
      - "${DOPPEL_DB_PORT:-5432}:5432"
    volumes:
      - doppel_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doppel -d doppel"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    # Up with the full stack (`--profile app`) or alone for a local `uv run` worker (`--profile worker`).
    profiles: ["app", "worker"]
    ports:
      - "${DOPPEL_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot schema migration — an EXPLICIT step before app/worker start, never their entrypoint
  # (Invariant #3). Exits 0 when up to date; app/worker depend on its success.
  migrate:
    build: .
    profiles: ["app"]
    command: ["python", "-m", "doppel.db.migrate", "up"]
    environment:
      DATABASE_URL: postgresql://doppel:doppel@postgres:5432/doppel
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    profiles: ["app"]
    command: ["uvicorn", "doppel.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${DOPPEL_APP_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql://doppel:doppel@postgres:5432/doppel
      REDIS_URL: redis://redis:6379
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LASTFM_API_KEY: ${LASTFM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-4-6}
      RESOLVE_CANDIDATE_LIMIT: ${RESOLVE_CANDIDATE_LIMIT:-75}
      JOB_TIMEOUT_S: ${JOB_TIMEOUT_S:-900}
      WORKER_MAX_JOBS: ${WORKER_MAX_JOBS:-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    profiles: ["app"]
    command: ["arq", "doppel.worker.worker.WorkerSettings"]
    environment:
      DATABASE_URL: postgresql://doppel:doppel@postgres:5432/doppel
      REDIS_URL: redis://redis:6379
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LASTFM_API_KEY: ${LASTFM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-4-6}
      RESOLVE_CANDIDATE_LIMIT: ${RESOLVE_CANDIDATE_LIMIT:-75}
      JOB_TIMEOUT_S: ${JOB_TIMEOUT_S:-900}
      WORKER_MAX_JOBS: ${WORKER_MAX_JOBS:-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  doppel_pgdata:
