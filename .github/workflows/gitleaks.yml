name: gitleaks

# push only on main: PR branches are already covered by the pull_request
# run, and an unscoped push trigger fired a duplicate run on every PR.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # allow manual runs from the Actions tab

permissions:
  contents: read  # least privilege; fixes CodeQL actions/missing-workflow-permissions

jobs:
  scan:
    name: scan for secrets
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          # full history so PR scans cover the entire diff range, not just the tip commit
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
