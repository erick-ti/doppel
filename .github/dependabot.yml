# Dependabot version updates. Security updates run separately (no config needed),
# and they intentionally bypass the cooldown below, since they fix known vulnerabilities.
# Minor and patch bumps are grouped into one PR per ecosystem to cut review noise;
# major bumps arrive as individual PRs so a breaking change is reviewed on its own.
# `cooldown` holds each version update until its release is 7 days old, so a bump is
# not proposed until it has survived the window where most malicious or broken releases
# are caught and yanked.
version: 2
updates:
  # Root Python project (pyproject.toml + uv.lock).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types:
          - "minor"
          - "patch"

  # Showcase frontend (web/package.json + package-lock.json).
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    ignore:
      # Lift when Next's eslint-plugin-import, eslint-plugin-jsx-a11y and
      # eslint-plugin-react dependencies all accept ESLint 10.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # typescript-eslint requires TypeScript <6.1.0. Lift when the installed
      # lint tooling supports TypeScript 7; #55 currently crashes in its parser.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      web-minor-patch:
        patterns: ["*"]
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used by the workflows in .github/workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"

  # Root Dockerfile and Compose images.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      docker-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
