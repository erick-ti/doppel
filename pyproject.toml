[project]
name = "doppel"
version = "0.1.0"
description = "Vibe-matching song recommendation engine (API-first)."
readme = "README.md"
authors = [
    { name = "Erick Ti", email = "63139298+erick-ti@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx[http2]>=0.28.1",
    "rapidfuzz>=3.14.5",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
clap = [
    "av>=17.0.1",
    "numpy>=2.4.6",
    "psutil>=7.2.2",
    "torch>=2.12.0",
    "transformers>=5.9.0",
]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]
