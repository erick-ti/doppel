[project]
name = "doppel"
version = "0.1.0"
description = "Vibe-matching song recommendation engine (API-first)."
readme = "README.md"
authors = [
    { name = "Erick Ti", email = "63139298+erick-ti@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiolimiter>=1.2.1",
    "anthropic>=0.124.0",
    "arq>=0.28.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "httpx[http2]>=0.28.1",
    "numpy>=2.5.2",
    "pgvector>=0.5.0",
    "python-dotenv>=1.2.3",
    "rapidfuzz>=3.14.5",
    "uvicorn[standard]>=0.51.0",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
clap = [
    "av>=18.1.0",
    "psutil>=7.2.2",
    "torch>=2.13.0",
    "transformers>=5.15.1",
]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

# Pin torch to the CPU-only wheel index. The default PyPI/torch resolution pulls
# the CUDA build (2.x+cuNNN + the full nvidia_* libs), which bloated the image to
# ~10.6 GB on a CPU-only VPS target. `explicit = true` keeps this index scoped to
# torch alone (everything else stays on PyPI). macOS is CPU-only upstream, so the
# index serves local dev unchanged; the Linux VPS build picks the +cpu wheel.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["scripts", "."]  # "." so tests can import the top-level eval/ harness package
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: hits live Deezer/MusicBrainz APIs; run with --run-integration",
    "db: needs a live Postgres + pgvector; run with --run-db",
]
